# OpenCode Configuration for HLSFactory Native
# This file configures OpenCode behavior when run from this directory

# Default agent to use
default_agent: hlsfactory-orchestrator

# Model configuration (uncomment and set your preferred model)
# model: anthropic/claude-sonnet-4

# Agent settings
agents:
  path: ./agents

# Tool permissions for automated operation
tools:
  # Enable file operations
  read: true
  write: true
  edit: true

  # Enable shell commands for compilation
  bash: true

  # Disable web-related tools
  webfetch: false
  websearch: false

  # Disable task delegation (we handle everything in one session)
  task: false

# Logging
log_level: INFO
