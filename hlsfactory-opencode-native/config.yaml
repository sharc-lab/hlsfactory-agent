# HLSFactory OpenCode Native Configuration
# This config is for reference - paths are passed directly to the agent

# Source repository containing HLS designs
source_repo: C:/Users/tanma/OneDrive/Documents/GitHub/S2CBench
output_dir: C:/Users/tanma/OneDrive/Documents/GitHub/S2CBench/_hlsfactory_output_native

# Compilation settings (used by the agent)
compilation:
  compiler: clang++
  flags:
    - "-c"           # Compile to object file (no linking)
    - "-std=c++17"   # C++ standard
    - "-Wall"        # Enable warnings
  max_fix_attempts: 3

# File patterns (used by the agent for identification)
patterns:
  source_extensions:
    - ".cpp"
    - ".c"
    - ".h"
    - ".hpp"
  testbench_patterns:
    - "tb_*.cpp"
    - "*_tb.cpp"
    - "*_test.cpp"
    - "test_*.cpp"
    - "testbench*.cpp"

# Stubs directory location (relative to this file)
stubs_dir: ./stubs
